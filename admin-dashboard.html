<!DOCTYPE html>
<html>
	<head>
		<title>Admin Dashboard | VAULT</title>
		<link href="css/admin-login.css" rel="stylesheet">
		<link href="https://fonts.googleapis.com/css2?family=PT+Sans:wght@400;700&display=swap" rel="stylesheet">
		<link rel="stylesheet"
		href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
	</head>

	<body>
		<div class="dashboard-page">
			<div class="dashboard-header">
				<div class="dashboard-logo">
					<img src="images/logo-1.png" alt="">
				</div>
				<h1>VAULT ADMIN DASHBOARD</h1>
			</div>
			<div class="stats-grid">
				<div class="stat-card">
					<i class="fa-solid fa-layer-group"></i>
					<h2>24</h2>
					<p>Total Projects</p>
				</div>
				<div class="stat-card">
					<i class="fa-solid fa-envelope"></i>
					<h2>18</h2>
					<p>Total Enquiries</p>
				</div>
				<div class="stat-card">
					<i class="fa-solid fa-users"></i>
					<h2>6</h2>
					<p>Team Members</p>
				</div>
				<div class="stat-card">
					<i class="fa-solid fa-compass-drafting"></i>
					<h2>3</h2>
					<p>Services</p>
				</div>
			</div>
			<div class="admin-actions">
				<a href="manage-projects.html" class="admin-btn">
					Manage Projects
				</a>
				<a href="manage-enquiries.html" class="admin-btn">
					Manage Enquiries
				</a>
				<a href="manage-team.html" class="admin-btn">
					Manage Team
				</a>
				<a href="admin-login.html" class="logout-btn">
					Logout
				</a>
			</div>
		</div>
	</body>
</html>
